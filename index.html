<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101114">
  <title>PDF Reader</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color-scheme: dark; background: #101114; color: #e6e7eb; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: .35; cursor: not-allowed; }
    button:focus-visible, .dropzone:focus-visible, input:focus-visible { outline: 2px solid #a8b5ff; outline-offset: 3px; }
    [hidden] { display: none !important; }
    .app { min-height: 100dvh; display: flex; flex-direction: column; }
    .toolbar { display: flex; align-items: center; gap: 12px; padding: 10px 18px; min-height: 64px; border-bottom: 1px solid #2b2d32; background: #16171b; position: sticky; top: 0; z-index: 20; }
    .brand { font-size: 15px; font-weight: 700; letter-spacing: -.025em; white-space: nowrap; }
    .filename { min-width: 0; max-width: 32ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #a4a6ae; font-size: 13px; }
    .spacer { flex: 1; }
    .controls { display: flex; align-items: center; gap: 6px; }
    .group { display: flex; gap: 5px; align-items: center; padding-left: 12px; border-left: 1px solid #34363c; }
    .control { border: 1px solid #33353c; background: #22242a; color: inherit; min-height: 36px; padding: 0 11px; border-radius: 8px; white-space: nowrap; }
    .control:hover:not(:disabled) { background: #30323a; }
    .page-input { width: 48px; text-align: center; padding: 0 4px; background: #22242a; color: inherit; border: 1px solid #34363c; border-radius: 7px; height: 36px; }
    .counter, .zoom-label { font-size: 13px; color: #acadb5; white-space: nowrap; }
    .zoom-label { min-width: 45px; text-align: center; }
    .landing { flex: 1; display: grid; place-items: center; padding: 32px 20px; }
    .dropzone { width: min(100%, 560px); min-height: 340px; padding: 48px 30px; border: 2px dashed #393c45; border-radius: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: #17191e; cursor: pointer; transition: background .15s, border-color .15s; }
    .dropzone:hover, .dropzone.dragover { border-color: #98a9ff; background: #1d2230; }
    .document-icon { display: grid; place-items: center; width: 74px; height: 74px; border-radius: 19px; background: #262b40; color: #b4c0ff; font-size: 36px; margin-bottom: 22px; }
    h1 { margin: 0 0 10px; font-size: clamp(24px, 5vw, 32px); letter-spacing: -.045em; }
    .description { color: #a7a9b2; line-height: 1.6; margin: 0 0 26px; }
    .pick { border: 0; border-radius: 10px; padding: 12px 22px; font-weight: 650; color: #111522; background: #b3c0ff; }
    .privacy { font-size: 12px; color: #81858f; margin-top: 24px; }
    .viewer { flex: 1; min-width: 0; background: #202126; overflow: auto; }
    .pages { padding: 28px 16px 60px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
    .page { position: relative; flex: 0 0 auto; background: white; box-shadow: 0 8px 35px #0005; max-width: 100%; }
    canvas { display: block; width: 100%; height: 100%; }
    .loading { color: #a4a6ae; padding: 24px; text-align: center; }
    .error { color: #ffb5b5; font-size: 13px; margin: 14px 0 0; text-align: center; }
    .drop-overlay { position: fixed; inset: 0; display: grid; place-items: center; background: #101114e8; color: #cbd3ff; border: 5px dashed #a8b5ff; z-index: 50; font-size: 24px; font-weight: 700; pointer-events: none; }
    @media (max-width: 750px) {
      .toolbar { flex-wrap: wrap; padding: 10px 12px; gap: 9px; }
      .filename { max-width: 35vw; }
      .controls { width: 100%; justify-content: space-between; }
      .group:first-child { padding-left: 0; border: 0; }
      .pages { padding: 14px 8px 40px; gap: 12px; }
      .control { padding: 0 8px; }
    }
  </style>
</head>
<body>
<div class="app">
  <header class="toolbar">
    <span class="brand">PDF Reader</span>
    <span class="filename" id="filename" title=""></span>
    <div class="spacer"></div>
    <button class="control" id="openButton" hidden>Open PDF</button>
    <div class="controls" id="controls" hidden>
      <div class="group">
        <button class="control" id="previous" aria-label="Previous page" title="Previous page">←</button>
        <input class="page-input" id="pageNumber" type="number" min="1" value="1" aria-label="Page number">
        <span class="counter" id="pageCount">/ 0</span>
        <button class="control" id="next" aria-label="Next page" title="Next page">→</button>
      </div>
      <div class="group">
        <button class="control" id="zoomOut" aria-label="Zoom out" title="Zoom out">−</button>
        <span class="zoom-label" id="zoomLabel">100%</span>
        <button class="control" id="zoomIn" aria-label="Zoom in" title="Zoom in">+</button>
        <button class="control" id="fit" title="Fit width">Fit</button>
      </div>
      <div class="group">
        <button class="control" id="mode" title="Toggle page colors">Original</button>
      </div>
    </div>
  </header>
  <main class="landing" id="landing">
    <div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="Choose or drop a PDF">
      <div class="document-icon" aria-hidden="true">▤</div>
      <h1>Your PDF, your space.</h1>
      <p class="description">Drop a PDF here, or choose one from your device.<br>Read comfortably in dark mode.</p>
      <span class="pick">Choose PDF</span>
      <span class="privacy">Private by design · Your file never leaves your browser</span>
      <p class="error" id="landingError" role="alert" hidden></p>
    </div>
  </main>
  <main class="viewer" id="viewer" hidden aria-label="PDF document">
    <div class="pages" id="pages"></div>
    <div class="loading" id="status" role="status" hidden></div>
  </main>
</div>
<div class="drop-overlay" id="dropOverlay" hidden>Drop your PDF to open it</div>
<input type="file" id="fileInput" accept=".pdf,application/pdf" hidden>
<script type="module">
  import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs";
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs";

  const $ = (id) => document.getElementById(id);
  const fileInput = $("fileInput");
  const pages = $("pages");
  const viewer = $("viewer");
  let pdf = null;
  let loadingTask = null;
  let generation = 0;
  let scale = 1;
  let fitWidth = true;
  let dark = true;
  let currentPage = 1;
  let pageSizes = [];
  let observer = null;
  let scrollTimer = null;
  const renders = new Map();

  function setError(message) {
    $("landingError").textContent = message;
    $("landingError").hidden = !message;
  }

  function showStatus(message) {
    $("status").textContent = message;
    $("status").hidden = !message;
  }

  function updateControls() {
    $("pageNumber").value = currentPage;
    $("pageCount").textContent = "/ " + (pdf?.numPages ?? 0);
    $("previous").disabled = currentPage <= 1;
    $("next").disabled = !pdf || currentPage >= pdf.numPages;
    $("zoomLabel").textContent = Math.round(scale * 100) + "%";
    $("mode").textContent = dark ? "Original" : "Dark";
    $("mode").setAttribute("aria-label", dark ? "Show original PDF colors" : "Show dark PDF colors");
  }

  function renderScale() {
    const available = Math.max(200, viewer.clientWidth - (window.innerWidth <= 750 ? 16 : 32));
    const widest = Math.max(...pageSizes.map((s) => s.width), 1);
    return fitWidth ? Math.min(2.5, available / widest) : scale;
  }

  function clearRenders() {
    for (const entry of renders.values()) entry.task?.cancel();
    renders.clear();
    if (observer) observer.disconnect();
    observer = null;
  }

  function setupPages(keepPosition = false) {
    if (!pdf) return;
    const desiredPage = keepPosition ? currentPage : 1;
    const effective = renderScale();
    if (fitWidth) scale = effective;
    clearRenders();
    pages.replaceChildren();
    const fragment = document.createDocumentFragment();
    for (let i = 0; i < pageSizes.length; i++) {
      const item = document.createElement("div");
      item.className = "page";
      item.dataset.page = String(i + 1);
      item.style.width = Math.floor(pageSizes[i].width * effective) + "px";
      item.style.height = Math.floor(pageSizes[i].height * effective) + "px";
      item.setAttribute("aria-label", "Page " + (i + 1));
      fragment.appendChild(item);
    }
    pages.appendChild(fragment);
    const localGeneration = generation;
    observer = new IntersectionObserver((entries) => {
      if (localGeneration !== generation) return;
      for (const entry of entries) {
        const pageNum = Number(entry.target.dataset.page);
        if (entry.isIntersecting) renderPage(pageNum, entry.target, localGeneration, effective);
        else unloadPage(pageNum, entry.target);
      }
      updateVisiblePage();
    }, { root: viewer, rootMargin: "900px 0px" });
    for (const element of pages.children) observer.observe(element);
    requestAnimationFrame(() => jumpToPage(desiredPage));
    updateControls();
  }

  async function renderPage(pageNum, element, token, effective) {
    if (renders.has(pageNum)) return;
    const entry = { task: null };
    renders.set(pageNum, entry);
    try {
      const page = await pdf.getPage(pageNum);
      if (token !== generation || renders.get(pageNum) !== entry) return;
      const viewport = page.getViewport({ scale: effective });
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.floor(viewport.width * ratio));
      canvas.height = Math.max(1, Math.floor(viewport.height * ratio));
      canvas.style.width = "100%";
      canvas.style.height = "100%";
      element.replaceChildren(canvas);
      entry.canvas = canvas;
      entry.task = page.render({
        canvasContext: canvas.getContext("2d", { alpha: false }),
        viewport,
        transform: ratio === 1 ? undefined : [ratio, 0, 0, ratio, 0, 0],
        pageColors: dark ? { background: "#1b1c20", foreground: "#e4e6ec" } : undefined
      });
      await entry.task.promise;
    } catch (err) {
      if (err?.name !== "RenderingCancelledException") console.error("PDF render failed:", err);
    }
  }

  function unloadPage(pageNum, element) {
    const entry = renders.get(pageNum);
    if (!entry) return;
    entry.task?.cancel();
    element.replaceChildren();
    renders.delete(pageNum);
  }

  function updateVisiblePage() {
    if (!pdf) return;
    const top = viewer.getBoundingClientRect().top;
    let closest = currentPage, distance = Infinity;
    for (const element of pages.children) {
      const rect = element.getBoundingClientRect();
      if (rect.bottom <= top || rect.top >= window.innerHeight) continue;
      const d = Math.abs(rect.top - top - 24);
      if (d < distance) { distance = d; closest = Number(element.dataset.page); }
    }
    if (closest !== currentPage) { currentPage = closest; updateControls(); }
  }

  function jumpToPage(num) {
    if (!pdf) return;
    const target = Math.max(1, Math.min(pdf.numPages, Math.round(num)));
    currentPage = target;
    const element = pages.children[target - 1];
    if (element) viewer.scrollTo({ top: element.offsetTop - pages.offsetTop - 20, behavior: "instant" });
    updateControls();
  }

  async function openPdf(file) {
    if (!file) return;
    if (!/\.pdf$/i.test(file.name) && file.type !== "application/pdf") {
      setError("Please choose a PDF file.");
      return;
    }
    setError("");
    generation++;
    const token = generation;
    clearRenders();
    if (loadingTask) { try { await loadingTask.destroy(); } catch {} }
    if (pdf) { pdf = null; }
    $("landing").hidden = true;
    viewer.hidden = false;
    $("controls").hidden = true;
    $("openButton").hidden = false;
    pages.replaceChildren();
    showStatus("Opening PDF…");
    try {
      const bytes = new Uint8Array(await file.arrayBuffer());
      if (token !== generation) return;
      loadingTask = pdfjsLib.getDocument({ data: bytes });
      const loaded = await loadingTask.promise;
      if (token !== generation) return;
      pdf = loaded;
      $("filename").textContent = file.name;
      $("filename").title = file.name;
      pageSizes = [];
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        if (token !== generation) return;
        const viewport = page.getViewport({ scale: 1 });
        pageSizes.push({ width: viewport.width, height: viewport.height });
      }
      showStatus("");
      $("controls").hidden = false;
      fitWidth = true;
      currentPage = 1;
      setupPages();
    } catch (err) {
      if (token !== generation) return;
      console.error("Unable to open PDF:", err);
      showStatus("");
      viewer.hidden = true;
      $("landing").hidden = false;
      $("controls").hidden = true;
      $("openButton").hidden = true;
      setError("Could not open this PDF. It might be damaged or password-protected.");
    }
  }

  $("dropzone").addEventListener("click", () => fileInput.click());
  $("dropzone").addEventListener("keydown", (event) => {
    if (event.key === "Enter" || event.key === " ") { event.preventDefault(); fileInput.click(); }
  });
  $("openButton").addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => {
    openPdf(fileInput.files?.[0]);
    fileInput.value = "";
  });
  let dragDepth = 0;
  window.addEventListener("dragenter", (event) => {
    if (!event.dataTransfer?.types.includes("Files")) return;
    event.preventDefault();
    dragDepth++;
    $("dropOverlay").hidden = false;
    $("dropzone").classList.add("dragover");
  });
  window.addEventListener("dragover", (event) => {
    if (event.dataTransfer?.types.includes("Files")) event.preventDefault();
  });
  window.addEventListener("dragleave", (event) => {
    event.preventDefault();
    dragDepth = Math.max(0, dragDepth - 1);
    if (!dragDepth) { $("dropOverlay").hidden = true; $("dropzone").classList.remove("dragover"); }
  });
  window.addEventListener("drop", (event) => {
    event.preventDefault();
    dragDepth = 0;
    $("dropOverlay").hidden = true;
    $("dropzone").classList.remove("dragover");
    openPdf(event.dataTransfer?.files?.[0]);
  });
  $("previous").addEventListener("click", () => jumpToPage(currentPage - 1));
  $("next").addEventListener("click", () => jumpToPage(currentPage + 1));
  $("pageNumber").addEventListener("change", () => jumpToPage(Number($("pageNumber").value) || currentPage));
  $("pageNumber").addEventListener("keydown", (event) => {
    if (event.key === "Enter") { event.target.blur(); jumpToPage(Number(event.target.value) || currentPage); }
  });
  function changeZoom(multiplier) {
    if (!pdf) return;
    scale = Math.max(.25, Math.min(4, scale * multiplier));
    fitWidth = false;
    setupPages(true);
  }
  $("zoomIn").addEventListener("click", () => changeZoom(1.2));
  $("zoomOut").addEventListener("click", () => changeZoom(1 / 1.2));
  $("fit").addEventListener("click", () => { fitWidth = true; setupPages(true); });
  $("mode").addEventListener("click", () => { dark = !dark; setupPages(true); });
  viewer.addEventListener("scroll", () => {
    if (scrollTimer) cancelAnimationFrame(scrollTimer);
    scrollTimer = requestAnimationFrame(updateVisiblePage);
  }, { passive: true });
  let resizeTimer;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (pdf && fitWidth) setupPages(true); }, 180);
  });
</script>
</body>
</html>
